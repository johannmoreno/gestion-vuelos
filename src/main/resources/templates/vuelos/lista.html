<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Vuelos')}"></head>
<body>
<header th:replace="~{fragments/comunes :: banda('vuelos')}"></header>

<main class="contenido">
    <div class="encabezado-seccion">
        <div>
            <h1>Vuelos</h1>
            <p class="subtitulo">Listado completo de vuelos registrados en el sistema.</p>
        </div>
        <a class="boton" th:href="@{/vuelos/nuevo}">+ Registrar vuelo</a>
    </div>

    <div th:replace="~{fragments/comunes :: mensajes}"></div>

    <div class="tabla-marco" th:if="${not #lists.isEmpty(vuelos)}">
        <table>
            <thead>
            <tr>
                <th>Vuelo</th>
                <th>Aerolinea</th>
                <th>Ruta</th>
                <th>Salida</th>
                <th>Cliente</th>
                <th class="valor">Valor</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vuelo : ${vuelos}">
                <td class="dato numero-vuelo" th:text="${vuelo.numero}">AV0000</td>
                <td th:text="${vuelo.aerolinea}">Aerolinea</td>
                <td class="dato" th:text="${vuelo.ruta}">Ruta</td>
                <td class="dato" th:text="${#temporals.format(vuelo.fechaSalida, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                <td th:text="${vuelo.cliente}">Cliente</td>
                <td class="dato valor" th:text="'$ ' + ${#numbers.formatDecimal(vuelo.valor, 0, 'POINT', 0, 'COMMA')}">$ 0</td>
                <td><span class="estado" th:classappend="'estado-' + ${vuelo.estado}" th:text="${vuelo.estado.etiqueta}">Estado</span></td>
                <td class="acciones">
                    <a class="boton pequeno secundario" th:href="@{/vuelos/{id}(id=${vuelo.id})}">Ver</a>
                    <a class="boton pequeno secundario" th:href="@{/vuelos/{id}/editar(id=${vuelo.id})}">Editar</a>
                    <form th:action="@{/vuelos/{id}/eliminar(id=${vuelo.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este vuelo? Esta accion no se puede deshacer.');">
                        <button class="boton pequeno peligro" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="vacio" th:if="${#lists.isEmpty(vuelos)}">
        Todavia no hay vuelos registrados. Usa el boton "Registrar vuelo" para crear el primero.
    </p>
</main>
</body>
</html>
