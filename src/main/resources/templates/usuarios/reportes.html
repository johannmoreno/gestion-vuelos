<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: cabecera('Reportes de usuarios')}"></head>
<body>
<header th:replace="~{fragments/comunes :: banda('reportes-usuario')}"></header>

<main class="contenido">
    <h1>Reportes de usuarios</h1>
    <p class="subtitulo">Consultas parametrizadas sobre los usuarios del sistema.</p>

    <h2>Usuarios por rol</h2>
    <div class="tabla-marco">
        <table>
            <thead>
            <tr>
                <th>Rol</th>
                <th>Cantidad</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fila : ${conteoPorRol}">
                <td th:text="${fila[0].etiqueta}">Rol</td>
                <td class="dato" th:text="${fila[1]}">0</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- REPORTE 1: por rol y estado (activo/inactivo) -->
    <div class="panel-consulta" style="margin-top:30px">
        <h2>Por rol y estado</h2>
        <form th:action="@{/usuarios/reportes}" method="get">
            <input type="hidden" name="reporte" value="rol">
            <div class="fila-filtros">
                <div class="campo">
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol">
                        <option value="">Todos</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}"
                                th:selected="${r == rolSeleccionado}">Rol</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="activo">Estado</label>
                    <select id="activo" name="activo">
                        <option value="">Todos</option>
                        <option value="true" th:selected="${activo != null and activo}">Activo</option>
                        <option value="false" th:selected="${activo != null and not activo}">Inactivo</option>
                    </select>
                </div>
                <div class="campo">
                    <button class="boton" type="submit">Buscar</button>
                </div>
            </div>
        </form>
    </div>

    <!-- REPORTE 2: busqueda por texto en nombre o correo -->
    <div class="panel-consulta">
        <h2>Por nombre o correo</h2>
        <form th:action="@{/usuarios/reportes}" method="get">
            <input type="hidden" name="reporte" value="texto">
            <div class="fila-filtros">
                <div class="campo">
                    <label for="texto">Texto a buscar</label>
                    <input type="text" id="texto" name="texto" th:value="${texto}" placeholder="Nombre o correo">
                </div>
                <div class="campo">
                    <button class="boton" type="submit">Buscar</button>
                </div>
            </div>
        </form>
    </div>

    <!-- RESULTADOS -->
    <div th:if="${reporte != null}">
        <h2>Resultados</h2>
        <div class="tabla-marco" th:if="${not #lists.isEmpty(resultados)}">
            <table>
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${resultados}">
                    <td class="dato" th:text="${usuario.nombre}">nombre</td>
                    <td th:text="${usuario.email}">correo</td>
                    <td th:text="${usuario.rol.etiqueta}">Rol</td>
                    <td>
                        <span th:if="${usuario.activo}" style="color:#2F7D53">Activo</span>
                        <span th:unless="${usuario.activo}" style="color:#B8423A">Inactivo</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="vacio" th:if="${#lists.isEmpty(resultados)}">
            No se encontraron usuarios con esos filtros.
        </p>
    </div>
</main>
</body>
</html>
